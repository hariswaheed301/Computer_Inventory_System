<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reset Password - Hardware Inventory</title>
    <link
      href="{{ url_for('static', filename='css/styles.css') }}"
      rel="stylesheet"
    />
  </head>
  <body class="bg-primary">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header">
              <h3 class="text-center my-3">Reset Password</h3>
            </div>
            <div class="card-body">
              {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %} {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
              {% endfor %} {% endif %} {% endwith %}

              <div
                class="alert alert-info"
                id="recoveryResetTtlMessage"
                data-remaining-seconds="{{ recovery_ttl_seconds|default(0) }}"
              >
                Recovery session expires in
                <strong><span id="recoveryResetTtlCountdown">{{ recovery_ttl_seconds|default(0) }}</span> sec</strong>.
              </div>

              <form id="resetPasswordForm" method="POST" action="{{ url_for('auth.reset_password') }}">
                <input
                  type="hidden"
                  name="csrf_token"
                  value="{{ csrf_token() }}"
                />
                <div class="form-floating mb-3">
                  <input
                    class="form-control"
                    id="newPasswordInput"
                    name="new_password"
                    type="password"
                    placeholder="New Password"
                    required
                  />
                  <label>New Password</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    class="form-control"
                    id="confirmPasswordInput"
                    name="confirm_password"
                    type="password"
                    placeholder="Confirm Password"
                    required
                  />
                  <label>Confirm Password</label>
                </div>
                <small class="text-muted d-block mb-3">
                  Password must be 6-128 characters
                </small>
                <button class="btn btn-primary w-100 py-2" id="resetPasswordBtn" type="submit">
                  Reset Password
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var ttlMessage = document.getElementById("recoveryResetTtlMessage");
        var countdownEl = document.getElementById("recoveryResetTtlCountdown");
        var newPasswordInput = document.getElementById("newPasswordInput");
        var confirmPasswordInput = document.getElementById("confirmPasswordInput");
        var submitBtn = document.getElementById("resetPasswordBtn");
        if (!ttlMessage) return;

        var remaining = parseInt(ttlMessage.dataset.remainingSeconds || "0", 10);

        var expireUi = function () {
          ttlMessage.classList.remove("alert-info");
          ttlMessage.classList.add("alert-danger");
          ttlMessage.textContent = "Recovery session expired. Please start recovery again.";
          if (newPasswordInput) newPasswordInput.disabled = true;
          if (confirmPasswordInput) confirmPasswordInput.disabled = true;
          if (submitBtn) submitBtn.disabled = true;
        };

        if (isNaN(remaining) || remaining <= 0) {
          expireUi();
          return;
        }

        var timer = setInterval(function () {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(timer);
            expireUi();
            return;
          }

          if (countdownEl) {
            countdownEl.textContent = String(remaining);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
