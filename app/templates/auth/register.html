{% extends "base.html" %} {% block title %}Register - Tech Inventory{% endblock
%} {% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-lg-6">
    <div class="card shadow-lg border-0 rounded-lg">
      <div class="card-header bg-dark text-white text-center py-3">
        <h4 class="mb-0">
          <i class="fas fa-user-plus me-2"></i>Create Staff Account
        </h4>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <div class="form-floating mb-3">
            <input
              class="form-control"
              id="inputUsername"
              name="username"
              type="text"
              placeholder="Username"
              required
            />
            <label for="inputUsername">Username</label>
          </div>

          <div class="form-floating mb-3">
            <input
              class="form-control"
              id="inputEmail"
              name="email"
              type="email"
              placeholder="name@example.com"
              required
            />
            <label for="inputEmail">Email Address</label>
          </div>

          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <div class="form-floating">
                <input
                  class="form-control"
                  id="inputPassword"
                  name="password"
                  type="password"
                  placeholder="Password"
                  required
                />
                <label for="inputPassword">Password</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating">
                <input
                  class="form-control"
                  id="inputConfirmPassword"
                  name="confirm_password"
                  type="password"
                  placeholder="Confirm Password"
                  required
                />
                <label for="inputConfirmPassword">Confirm Password</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-bold"
              >Select Role</label
            >
            <select class="form-select" name="role">
              <option value="STORE_PERSON">Store Person</option>
              <option value="ADMIN">Administrator</option>
            </select>
          </div>

          <div class="mt-4">
            <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">
              Register Account
            </button>
          </div>
        </form>
      </div>
      <div class="card-footer text-center py-3">
        <div class="small">
          Already registered?
          <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
