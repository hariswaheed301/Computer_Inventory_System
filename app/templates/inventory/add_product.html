{% extends "base.html" %} {% block content %}
<h1 class="mt-2">Add New Product</h1>
<hr />

<div class="card shadow mb-4">
  <div class="card-body">
    <form
      method="POST"
      action="{{ url_for('stock.add_product') }}"
      enctype="multipart/form-data"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">SKU Code</label>
          <input
            type="text"
            name="sku"
            id="sku_field"
            class="form-control"
            placeholder="Auto-generated when subcategory is selected"
            required
          />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Product Name</label>
          <input type="text" name="name" class="form-control" required />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label fw-bold">Brand</label>
          <select name="brand_id" class="form-select" required>
            {% for b in brands %}
            <option value="{{ b.id }}">{{ b.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Category</label>
          <select
            id="parent_category"
            class="form-select"
            data-category-parent
            required
          >
            <option value="" selected disabled>Select a category</option>
            {% for c in categories %} {% if c.parent_id is none %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endif %} {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Subcategory</label>
          <select
            id="subcategory"
            name="category_id"
            class="form-select"
            data-category-child
            required
            disabled
          >
            <option value="" selected disabled>Select a category first</option>
            {% for c in categories %} {% if c.parent_id is not none %}
            <option value="{{ c.id }}" data-parent-id="{{ c.parent_id }}">
              {{ c.name }}
            </option>
            {% endif %} {% endfor %}
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3">
          <label class="form-label fw-bold">Quantity</label>
          <input
            type="number"
            name="quantity"
            class="form-control"
            value="10"
            required
          />
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold">Reorder Level</label>
          <input
            type="number"
            name="reorder_level"
            class="form-control"
            value="5"
            required
          />
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold">Cost Price (₨)</label>
          <input
            type="number"
            step="0.01"
            name="cost_price"
            class="form-control"
            required
          />
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold">Retail Price (₨)</label>
          <input
            type="number"
            step="0.01"
            name="retail_price"
            class="form-control"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Product Image</label>
        <input type="file" name="image" class="form-control" accept="image/*" />
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Description</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-primary fw-bold">
        <i class="fas fa-plus me-1"></i> Save Product
      </button>
    </form>
  </div>
</div>
{% endblock %}
