{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mt-2 mb-3">
    <h1>Edit Product: {{ product.name }}</h1>
    <a href="{{ url_for('stock.product_detail', product_id=product.id) }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i> Back to Detail View
    </a>
</div>
<hr />

<div class="card shadow mb-4">
    <div class="card-body">
        <form method="POST" action="{{ url_for('stock.edit_product', product_id=product.id) }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">SKU Code (Read-Only)</label>
                    <input type="text" class="form-control bg-light" value="{{ product.sku }}" readonly />
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Product Name</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required />
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Brand</label>
                    <select name="brand_id" class="form-select" required>
                        {% for b in brands %}
                            <option value="{{ b.id }}" {% if b.id == product.brand_id %}selected{% endif %}>{{ b.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Category</label>
                    <select id="parent_category" class="form-select" data-category-parent required>
                        <option value="" disabled>Select a category</option>
                        {% for c in categories %}
                            {% if c.parent_id is none %}
                            <option value="{{ c.id }}">{{ c.name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Subcategory</label>
                    <select id="subcategory" name="category_id" class="form-select" data-category-child required disabled>
                        <option value="" disabled>Select a category first</option>
                        {% for c in categories %}
                            {% if c.parent_id is not none %}
                            <option value="{{ c.id }}" data-parent-id="{{ c.parent_id }}" {% if c.id == product.category_id %}selected{% endif %}>{{ c.name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold">Stock Quantity</label>
                    <input type="number" name="quantity" class="form-control" value="{{ product.quantity }}" required />
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Reorder Level</label>
                    <input type="number" name="reorder_level" class="form-control" value="{{ product.reorder_level }}" required />
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Cost Price (₨)</label>
                    <input type="number" step="0.01" name="cost_price" class="form-control" value="{{ product.cost_price }}" required />
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Retail Price (₨)</label>
                    <input type="number" step="0.01" name="retail_price" class="form-control" value="{{ product.retail_price }}" required />
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold d-block">Current Image</label>
                    <img src="{{ url_for('static', filename='uploads/products/' + product.image_url) }}" 
                         alt="{{ product.name }}" class="img-thumbnail" style="height: 100px;"
                         onerror="this.src='https://via.placeholder.com/100?text=No+Img';">
                </div>
                <div class="col-md-9">
                    <label class="form-label fw-bold">Upload New Image (Optional)</label>
                    <input type="file" name="image" class="form-control" accept="image/*" />
                    <div class="form-text">Leave blank if you don't want to replace the existing image.</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ product.description or '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-warning fw-bold">
                <i class="fas fa-save me-1"></i> Update Product Details
            </button>
        </form>
    </div>
</div>
{% endblock %}
