services:
  - type: web
    name: computer-inventory-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: computer-inventory-db
          property: connectionString

databases:
  - name: computer-inventory-db
    databaseName: computer_inventory
    user: computer_inventory_user
